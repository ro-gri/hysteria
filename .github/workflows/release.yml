name: "Build release"

on:
  workflow_dispatch:
  push:
    tags:
      - app/v*.*.*

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/app/')
    uses: ./.github/workflows/build-common.yml

  publish:
    name: Publish
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build-temp-${{ github.sha }}
          path: build

      - name: Upload GitHub
        uses: softprops/action-gh-release@v3
        with:
          files: build/*
